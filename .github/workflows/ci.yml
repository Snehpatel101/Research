name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1" # weekly full run incl. slow end-to-end tests
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install (CPU torch)
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev,stats]"

      - name: Lint
        run: uv run --no-sync ruff check src/

      - name: Format
        run: uv run --no-sync black --check src/ tests/

      - name: Types
        run: uv run --no-sync pyright

      - name: Dead code
        run: uv run --no-sync vulture

      - name: Fast tests
        run: uv run --no-sync pytest -m "not slow" -n auto --dist loadfile

  slow:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.11"

      - name: Install (CPU torch)
        run: |
          uv venv
          uv pip install torch --index-url https://download.pytorch.org/whl/cpu
          uv pip install -e ".[dev,stats]"

      - name: End-to-end tests
        run: uv run --no-sync pytest -m slow -n 2 --dist loadfile
