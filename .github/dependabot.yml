# Weekly dependency updates. Minor/patch bumps are grouped into one PR per
# ecosystem; major bumps arrive as individual PRs so each gets its own review.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # uv.lock (CI installs from it and fails on drift via `uv lock --check`).
  # lockfile-only: bump the locked versions, leave the pyproject lower bounds.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    versioning-strategy: "lockfile-only"
    open-pull-requests-limit: 10
    groups:
      python-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # Hook revisions in .pre-commit-config.yaml.
  - package-ecosystem: "pre-commit"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      pre-commit-hooks:
        patterns: ["*"]
