experiment:
  name: "Quick Baseline - Single Model"
  description: "Fast baseline validation with XGBoost"

data:
  symbol: "MES"
  horizons: [20]
  timeframe: "5min"
  data_dir: "data/splits/scaled"

features:
  mode: "minimal"
  optimize: false
  mtf_strategy: "none"

models:
  train_multiple: false
  model_list:
    - name: "xgboost"
      optimize_hyperparams: false

ensemble:
  enabled: false

advanced:
  regime_aware: false
  meta_labeling: false
  cross_validation:
    enabled: true
    n_splits: 3

output:
  save_dir: "experiments/quick_baseline"
  save_predictions: true
  save_feature_importance: true
  generate_report: true
