experiment:
  name: "Research 2024 Features Benchmark"
  description: "Focus on 2024 research-backed microstructure features"

data:
  symbol: "MES"
  horizons: [20]
  timeframe: "5min"
  data_dir: "data/splits/scaled"

features:
  mode: "research_2024"
  optimize: false
  mtf_strategy: "indicators"

models:
  train_multiple: true
  model_list:
    - name: "xgboost"
      optimize_hyperparams: true
      optimization:
        n_trials: 100
    - name: "catboost"
      optimize_hyperparams: false
    - name: "transformer"
      seq_len: 60
      optimize_hyperparams: false

ensemble:
  enabled: true
  method: "stacking"
  meta_learner: "ridge_meta"

advanced:
  regime_aware: false
  meta_labeling: false
  cross_validation:
    enabled: true
    n_splits: 5

output:
  save_dir: "experiments/research_2024"
  save_predictions: true
  save_feature_importance: true
  generate_report: true
