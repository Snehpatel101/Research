experiment:
  name: "Full Benchmark - All Models"
  description: "Comprehensive benchmark across all 23 models with 2024 features"

data:
  symbol: "MES"
  horizons: [5, 10, 15, 20]
  timeframe: "5min"
  data_dir: "data/splits/scaled"

features:
  mode: "full"
  optimize: false
  mtf_strategy: "indicators"
  mtf_timeframes: ["1min", "15min", "60min"]

models:
  train_multiple: true
  model_list:
    - name: "xgboost"
      optimize_hyperparams: true
      optimization:
        n_trials: 100
    - name: "lightgbm"
      optimize_hyperparams: true
      optimization:
        n_trials: 100
    - name: "catboost"
      optimize_hyperparams: false
    - name: "random_forest"
      optimize_hyperparams: false
    - name: "lstm"
      seq_len: 60
      optimize_hyperparams: false
    - name: "gru"
      seq_len: 60
      optimize_hyperparams: false
    - name: "tcn"
      seq_len: 60
      optimize_hyperparams: false

ensemble:
  enabled: true
  method: "stacking"
  meta_learner: "ridge_meta"
  base_models: ["xgboost", "lightgbm", "catboost", "lstm", "tcn"]

advanced:
  regime_aware: false
  meta_labeling: false
  cross_validation:
    enabled: true
    n_splits: 5

output:
  save_dir: "experiments/full_benchmark"
  save_predictions: true
  save_feature_importance: true
  generate_report: true
