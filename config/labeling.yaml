# Triple Barrier Labeling Configuration
# Configures the triple barrier method for generating directional labels
#
# Overview:
#   The triple barrier method labels each sample based on which barrier is hit first:
#   - Upper (Profit) Barrier: close * (1 + profit_threshold) -> Label = Long (1)
#   - Lower (Loss) Barrier: close * (1 - loss_threshold) -> Label = Short (-1)
#   - Time Barrier: Maximum holding period (horizon) -> Label = Neutral (0)
#
# Reference: PHASE_4_LABELING.md, config/optimization/label_optimization.yaml

# =============================================================================
# BARRIER PARAMETERS
# =============================================================================

barriers:
  # Barrier calculation method
  method: "atr_based"  # Options: "atr_based", "fixed_pct", "volatility_scaled"

  # ATR-based barrier calculation (recommended)
  # barrier_threshold = ATR * multiplier
  atr_based:
    # ATR calculation period (typically 7-28 bars)
    atr_period: 14
    # Upper barrier multiplier (profit target = ATR * upper_mult)
    upper_mult: 2.0
    # Lower barrier multiplier (stop loss = ATR * lower_mult)
    lower_mult: 1.5
    # Asymmetric barriers allow different risk/reward ratios
    asymmetric: true

  # Fixed percentage thresholds (alternative method)
  # Use when ATR-based causes too much variation across market conditions
  fixed_pct:
    profit_threshold: 0.015  # 1.5% profit target
    loss_threshold: 0.010    # 1.0% stop loss

  # Volatility-scaled (adaptive to regime)
  volatility_scaled:
    base_profit: 0.015
    base_loss: 0.010
    vol_lookback: 20
    scaling_factor: 1.0

# =============================================================================
# SYMBOL-SPECIFIC BARRIER OVERRIDES
# =============================================================================

# Override default barriers for specific instruments
symbol_overrides:
  MES:
    # E-mini S&P 500 (high liquidity, lower volatility)
    description: "E-mini S&P 500 futures"
    atr_period: 14
    upper_mult: 2.1
    lower_mult: 1.4
    # Resulting profit:loss ratio = 1.5:1
    fixed_pct:
      profit_threshold: 0.015
      loss_threshold: 0.010

  MGC:
    # E-mini Gold (commodity, higher volatility)
    description: "E-mini Gold futures"
    atr_period: 14
    upper_mult: 1.8
    lower_mult: 1.2
    fixed_pct:
      profit_threshold: 0.012
      loss_threshold: 0.008

  MNQ:
    # E-mini Nasdaq-100 (tech-heavy, higher volatility)
    description: "E-mini Nasdaq-100 futures"
    atr_period: 14
    upper_mult: 2.5
    lower_mult: 1.6
    fixed_pct:
      profit_threshold: 0.018
      loss_threshold: 0.012

  MCL:
    # E-mini Crude Oil (high volatility commodity)
    description: "E-mini Crude Oil futures"
    atr_period: 14
    upper_mult: 2.8
    lower_mult: 1.8
    fixed_pct:
      profit_threshold: 0.025
      loss_threshold: 0.015

# =============================================================================
# HORIZON CONFIGURATION
# =============================================================================

horizons:
  # Maximum holding period (bars until time barrier)
  # Multiple horizons support multi-horizon label generation
  supported: [1, 5, 10, 15, 20, 30, 60, 120]

  # Active horizons for training
  # H1 excluded by default due to transaction cost dominance
  active: [5, 10, 15, 20]

  # Default horizon if not specified
  default: 20

  # Multi-horizon batch processing
  batch_processing:
    enabled: false  # Set true to generate all horizons in one run
    # Output columns: label_h5, label_h10, label_h15, label_h20

# =============================================================================
# QUALITY WEIGHTING
# =============================================================================

quality_weights:
  enabled: true

  # Fast touches = high confidence signals
  fast_touch:
    threshold: 0.5  # Touch in <50% of horizon
    weight: 1.5     # 50% weight boost

  # Slow touches = lower confidence
  slow_touch:
    threshold: 0.8  # Touch in >80% of horizon
    weight: 0.5     # 50% weight reduction

  # Time barrier (neutral labels) = lowest confidence
  time_barrier:
    weight: 0.5

  # Default weight for normal touches
  default_weight: 1.0

# =============================================================================
# TRANSACTION COSTS
# =============================================================================

transaction_costs:
  # Include transaction costs in label quality evaluation
  enabled: true

  # Cost model
  model: "fixed_plus_pct"  # Options: "fixed", "pct", "fixed_plus_pct"

  # Fixed costs (per contract, per side)
  fixed:
    commission: 0.50      # $0.50 per side
    exchange_fee: 0.25    # Exchange fees

  # Percentage costs (as decimal)
  percentage:
    slippage: 0.0001     # 1 basis point slippage

  # Per-symbol overrides
  symbol_costs:
    MES:
      commission: 0.50
      slippage_ticks: 1   # ~$1.25
      round_trip_pct: 0.0002  # ~2 basis points total
    MGC:
      commission: 0.50
      slippage_ticks: 1
      round_trip_pct: 0.0003
    MNQ:
      commission: 0.50
      slippage_ticks: 0.5
      round_trip_pct: 0.0002
    MCL:
      commission: 0.50
      slippage_ticks: 1
      round_trip_pct: 0.0004

# =============================================================================
# LABEL DISTRIBUTION CONSTRAINTS
# =============================================================================

constraints:
  # Minimum samples per class for valid labeling
  min_samples_per_class: 1000

  # Maximum acceptable class imbalance
  # Deviation from 33% balanced distribution
  max_class_imbalance: 0.4  # Allow 33% +/- 13%

  # Minimum barrier hit rate (profit + loss hits vs time barrier)
  min_barrier_hit_rate: 0.3  # At least 30% clear signals

  # Warn if label distribution is skewed
  imbalance_warning_threshold: 0.3

# =============================================================================
# OPTUNA OPTIMIZATION REFERENCE
# =============================================================================

# Optuna optimization for barrier parameters
# Full configuration in: config/optimization/label_optimization.yaml
optimization:
  enabled: true
  config_path: "config/optimization/label_optimization.yaml"

  # Quick reference for search space
  search_space:
    upper_mult: [0.5, 3.0]
    lower_mult: [0.5, 3.0]
    horizon: [5, 30]
    atr_period: [10, 30]

  # Optimization objective
  objective:
    primary: "sharpe_ratio"
    secondary: "label_quality_score"

  # Trials and timeout
  n_trials: 100
  timeout_seconds: 7200  # 2 hours

# =============================================================================
# OUTPUT CONFIGURATION
# =============================================================================

output:
  # Label column name
  label_column: "label"

  # Additional metadata columns
  metadata_columns:
    - barrier_touch      # 'profit', 'loss', 'time'
    - touch_time         # Bars until barrier hit
    - sample_weight      # Quality weight (0.5-1.5)
    - profit_barrier     # Actual barrier price
    - loss_barrier       # Actual barrier price

  # Save labeled data
  save_path: "data/labeled/{symbol}_labeled_h{horizon}.parquet"

  # Save labeling metadata
  metadata_path: "data/labeled/{symbol}_labeling_metadata.json"

# =============================================================================
# CACHING
# =============================================================================

caching:
  # Cache optimized barrier parameters
  enabled: true
  cache_path: "data/optimization/barrier_cache.json"

  # Skip optimization if cache exists and data hasn't changed
  use_cache: true

  # Cache structure:
  # {
  #   "MES": {
  #     "horizon_5": {"upper_mult": 2.1, "lower_mult": 1.4, "sharpe": 1.45},
  #     "horizon_10": {...},
  #     "horizon_20": {...}
  #   },
  #   "MGC": {...}
  # }

# =============================================================================
# PIPELINE INTEGRATION
# =============================================================================

# Stage 7 in the 16-stage unified pipeline
# See: docs/implementation/UNIFIED_PIPELINE_ARCHITECTURE.md
pipeline:
  stage: 7
  name: "OPTUNA Label Optimization"

  # Input from previous stage
  input: "data/features/{symbol}_features.parquet"

  # Output to next stage
  output: "data/labeled/{symbol}_labeled.parquet"

  # Dependencies
  depends_on:
    - stage_5_features
    - stage_6_regime

# Reproducibility
random_seed: 42
