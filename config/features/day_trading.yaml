# Feature Engineering Configuration for Day Trading
# Optimized for 1-5 minute intraday trading

feature_groups:
  # NEW: 2024 Research-Backed Microstructure Features
  microstructure_2024:
    enabled: true
    description: "Research-backed features from 2024 papers (Edge spread, timing, VPIN)"
    features:
      - edge_spread_pct
      - roll_spread_pct
      - time_to_high
      - time_to_low
      - close_after_high
      - intrabar_reversal
      - kyle_lambda
      - amihud_illiquidity
      - vpin
      - volume_density
      - volume_concentration
      - volume_at_extremes
      - body_size_pct
      - upper_wick_pct
      - lower_wick_pct
      - bar_range_pct
      - body_range_ratio
      - bar_direction
    references:
      - "Ardia et al. (2024): Efficient bid-ask spreads from OHLC"
      - "arXiv:2509.16137 (2024): Timing features for VWAP prediction"
      - "Easley et al. (2024): Market microstructure in crypto"
  
  # Classical Microstructure (existing)
  microstructure_classical:
    enabled: true
    description: "Classical microstructure features from existing codebase"
    features:
      - micro_amihud
      - micro_roll_spread
      - micro_kyle_lambda
      - micro_cs_spread
      - micro_rel_spread
      - micro_volume_imbalance
      - micro_trade_intensity
      - micro_efficiency
      - micro_vol_ratio
  
  # Momentum Indicators
  momentum:
    enabled: true
    description: "Classical momentum indicators"
    features:
      - rsi_14
      - macd
      - macd_signal
      - macd_hist
      - mfi
      - roc
      - cci
      - stochastic_k
      - stochastic_d
      - williams_r
  
  # Volatility Indicators
  volatility:
    enabled: true
    description: "Volatility and range indicators"
    features:
      - atr_7
      - atr_14
      - atr_21
      - bb_upper
      - bb_middle
      - bb_lower
      - bb_width
      - keltner_upper
      - keltner_lower
      - keltner_width
      - historical_vol
      - parkinson_vol
      - garman_klass_vol
      - rogers_satchell_vol
      - yang_zhang_vol
  
  # Volume Indicators
  volume:
    enabled: true
    description: "Volume-based features"
    features:
      - volume_sma
      - volume_ratio
      - obv
      - vwap
      - dollar_volume
      - twap
  
  # Trend Indicators
  trend:
    enabled: true
    description: "Trend identification features"
    features:
      - adx_14
      - di_plus
      - di_minus
      - supertrend
      - supertrend_direction
  
  # Wavelets
  wavelets:
    enabled: true
    description: "Multi-scale frequency analysis"
    wavelet_type: "db4"
    wavelet_level: 3
    wavelet_window: 64
    features:
      - wavelet_approx_*
      - wavelet_detail_*
      - wavelet_energy_*
      - wavelet_volatility_*
  
  # MTF Indicators (Multi-Timeframe)
  mtf_indicators:
    enabled: true
    description: "Indicators from higher timeframes"
    timeframes: ["1min", "5min", "15min", "60min"]
    indicators: ["rsi", "atr", "vwap", "bb_width"]
  
  # Regime Features
  regime:
    enabled: true
    description: "Market regime identification"
    features:
      - regime_volatility
      - regime_trend
      - regime_composite
  
  # Temporal Features
  temporal:
    enabled: true
    description: "Time-based features"
    features:
      - hour_sin
      - hour_cos
      - minute_sin
      - minute_cos
      - day_of_week
  
  # DISABLED: Not useful for intraday
  daily_indicators:
    enabled: false
    description: "Daily timeframe indicators (too slow for 1-5 min)"
    features:
      - sma_200
      - ema_200

# Feature Selection Configuration
feature_selection:
  enabled: true
  method: "mda"
  n_features_by_model:
    xgboost: 100
    lightgbm: 100
    catboost: 100
    random_forest: 80
    lstm: 60
    gru: 60
    tcn: 60
    transformer: 50
    patchtst: 40
    itransformer: 40
    tft: 50

# Feature Engineering Modes
modes:
  full:
    description: "All features (~210 with 2024 microstructure)"
    groups:
      - microstructure_2024
      - microstructure_classical
      - momentum
      - volatility
      - volume
      - trend
      - wavelets
      - mtf_indicators
      - regime
      - temporal
  
  hft_only:
    description: "Only microstructure + bar structure (~20 features)"
    groups:
      - microstructure_2024
  
  classical:
    description: "Classical TA only (~150 features)"
    groups:
      - microstructure_classical
      - momentum
      - volatility
      - volume
      - trend
      - mtf_indicators
  
  minimal:
    description: "Minimal for prototyping (~60 features)"
    groups:
      - momentum
      - volatility
      - trend
  
  research_2024:
    description: "Focus on 2024 research features"
    groups:
      - microstructure_2024
      - momentum
      - volatility
      - wavelets

# Anti-Leakage Settings
anti_leakage:
  enabled: true
  shift_features: 1
  train_only_scaling: true
  purge_bars: 60
  embargo_bars: 1440

# NaN Handling
nan_handling:
  threshold: 0.9
  method: "drop"
