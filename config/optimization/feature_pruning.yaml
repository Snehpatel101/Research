# Feature Pruning Optimization Configuration
# ============================================
# Pipeline Stage: 9 of 16
# Purpose: Importance-based feature pruning to reduce dimensionality
# Integration: Part of unified 16-stage ML Factory pipeline
#
# This stage runs AFTER Stage 8 (Feature Selection) and BEFORE Stage 10 (Splits).
# It fine-tunes the feature set by removing low-importance individual features.
#
# Reference: docs/implementation/UNIFIED_PIPELINE_ARCHITECTURE.md

optimization:
  name: feature_pruning
  description: Importance-based feature pruning using Optuna
  framework: optuna
  n_trials: 50
  timeout: 3600  # 1 hour
  direction: maximize

  # Pipeline stage metadata
  stage_number: 9
  stage_name: "OPTUNA Feature Pruning"
  depends_on:
    - stage_8_feature_selection
  outputs:
    - pruned_feature_mask.json
    - feature_importance_ranking.csv
    - pruning_study.db

# Optuna sampler configuration
# TPE (Tree-structured Parzen Estimator) is recommended for feature pruning
# as it efficiently explores continuous threshold spaces
sampler:
  type: tpe
  seed: 42
  n_startup_trials: 10
  multivariate: true
  group: true  # Enable group sampling for correlated parameters
  constant_liar: true  # For parallel execution support

# Optuna trial pruner configuration (for early stopping of unpromising trials)
# This prunes Optuna TRIALS, not features - don't confuse with feature pruning
pruner:
  type: median
  n_startup_trials: 5
  n_warmup_steps: 5
  interval_steps: 1

  # Alternative pruner configurations (uncomment to use)
  # ---------------------------------------------------
  # Hyperband Pruner - aggressive early stopping
  # type: hyperband
  # min_resource: 1
  # max_resource: 50
  # reduction_factor: 3
  #
  # Successive Halving Pruner - balanced early stopping
  # type: successive_halving
  # min_resource: 1
  # reduction_factor: 4
  # min_early_stopping_rate: 0
  #
  # Patient Pruner - wait longer before pruning
  # type: patient
  # wrapped_pruner:
  #   type: median
  #   n_startup_trials: 5
  # patience: 5
  #
  # Percentile Pruner - prune bottom N%
  # type: percentile
  # percentile: 25  # Prune trials in bottom 25%
  # n_startup_trials: 5
  # n_warmup_steps: 3

# Automated pruning callbacks for integration with training
# These control when/how to report intermediate values for trial pruning
pruning_callbacks:
  enabled: true

  # Report intermediate score after each CV fold
  report_cv_folds: true
  report_frequency: 1  # Report after every fold

  # Early stopping within trial
  early_stopping:
    enabled: true
    patience: 3  # Stop if no improvement for 3 CV folds
    min_delta: 0.001  # Minimum improvement threshold

  # Pruning decision callback
  on_prune:
    log_reason: true  # Log why trial was pruned
    save_partial_results: true  # Save results even for pruned trials

# Search space configuration
search_space:
  # Importance threshold (features below this are removed)
  importance_threshold:
    description: Minimum importance score to retain feature
    type: float
    low: 0.001
    high: 0.1
    log: true
    # Typical optimal range: 0.002-0.02
    # Lower threshold = keep more features
    # Higher threshold = aggressive pruning

  # Importance calculation method
  importance_method:
    description: Method for calculating feature importance
    type: categorical
    choices:
      - permutation     # Most reliable, but slowest (n_repeats evaluations)
      - shap            # SHAP values - interpretable, moderate speed
      - gain            # Tree split gain - fast, built into boosting models
      - split           # Number of splits - fast, less reliable
      - weight          # Feature weight - fastest, least reliable
    # Recommendation: Use 'gain' for speed, 'permutation' for accuracy

  # Aggregation method for CV importance scores
  aggregation:
    description: How to aggregate importance across CV folds
    type: categorical
    choices:
      - mean    # Average importance - balanced
      - median  # Robust to outlier folds
      - min     # Conservative - only prune if low in ALL folds

  # Correlation-based pruning threshold
  max_correlation:
    description: Maximum allowed correlation between retained features
    type: float
    low: 0.80
    high: 0.99
    log: false
    # Higher threshold = keep correlated features
    # Lower threshold = aggressive redundancy removal

  # Variance-based filtering
  min_variance_percentile:
    description: Minimum variance percentile to retain feature
    type: float
    low: 0.01
    high: 0.15
    log: false
    # Features in bottom N% variance are pruned

  # Top-K feature limit (optional constraint)
  top_k_features:
    description: Maximum number of features to retain (0 = no limit)
    type: int
    low: 0
    high: 100
    # Set to 0 to disable top-K limiting

# Advanced pruning strategies (hierarchical pruning)
pruning_strategies:
  # Strategy 1: Threshold-based (default)
  threshold_based:
    enabled: true
    description: Prune features below importance threshold

  # Strategy 2: Top-K selection
  top_k:
    enabled: false
    k: 50  # Keep top 50 features
    description: Keep only top K most important features

  # Strategy 3: Elbow method (automatic threshold detection)
  elbow:
    enabled: false
    sensitivity: 0.1  # Sensitivity for elbow detection
    description: Automatically detect optimal pruning threshold

  # Strategy 4: Cumulative importance
  cumulative:
    enabled: false
    target_cumulative: 0.95  # Keep features explaining 95% of importance
    description: Keep features until cumulative importance reaches target

  # Strategy 5: Statistical significance
  significance:
    enabled: false
    p_threshold: 0.05  # Only keep features with p < 0.05
    n_permutations: 100
    description: Permutation test for feature significance

# Importance calculation settings
importance_calculation:
  # Base model for importance computation
  # This model is trained to compute feature importances for pruning decisions
  model: xgboost
  model_params:
    n_estimators: 200
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
    # Use early stopping to prevent overfitting during importance calculation
    early_stopping_rounds: 20

  # Permutation importance settings
  # Most reliable method but slowest - use for final pruning decisions
  permutation:
    n_repeats: 5  # Number of permutation repeats per feature
    scoring: f1_macro  # Metric for importance measurement
    n_jobs: -1  # Parallel computation
    random_state: 42
    # For each feature, importance = mean(baseline_score - permuted_score)

  # SHAP (SHapley Additive exPlanations) settings
  # Provides interpretable importance with additive feature contributions
  shap:
    max_samples: 5000  # Subsample for speed (SHAP is O(n^2))
    check_additivity: false  # Disable slow additivity check
    feature_perturbation: "interventional"  # or "tree_path_dependent"
    # Output: mean(|SHAP value|) per feature

  # Tree-based importance settings
  # Fast built-in importance for boosting models
  tree_importance:
    importance_type: gain  # Recommended: gain or total_gain
    # Options:
    #   - gain: Total gain from splits on feature (recommended)
    #   - split: Number of times feature is used in splits
    #   - weight: Number of times feature appears in trees
    #   - cover: Mean coverage of splits using feature
    #   - total_gain: Total gain normalized by tree count
    #   - total_cover: Total coverage normalized
    normalize: true  # Normalize importances to sum to 1.0

  # Cross-validation for importance stability
  cv_importance:
    enabled: true
    n_splits: 3  # Number of CV folds for importance calculation
    aggregate: mean  # How to aggregate importance across folds

# Objective function
# Defines what Optuna optimizes for feature pruning
objective:
  metric: f1_macro  # Primary metric for pruned model evaluation
  direction: maximize

  # Trade-off between performance and feature count
  # Rewards models that achieve good performance with fewer features
  efficiency_bonus:
    enabled: true
    weight: 0.1  # Bonus for fewer features at same performance
    # Final score = metric_score + (features_removed / total_features) * weight

  # Multi-objective optimization (optional)
  multi_objective:
    enabled: false
    objectives:
      - name: f1_macro
        direction: maximize
        weight: 0.7
      - name: feature_count
        direction: minimize
        weight: 0.3
    # Uses Pareto front when enabled

  # Penalty terms to discourage bad pruning decisions
  penalties:
    # Penalty for removing too many features
    over_pruning:
      enabled: true
      threshold: 0.6  # Penalty if > 60% features removed
      weight: 0.2

    # Penalty for keeping highly correlated features
    correlation:
      enabled: true
      threshold: 0.95
      weight: 0.1

# Evaluation configuration
# Defines how to evaluate pruned feature sets
evaluation:
  # Model for validation (should match target model family)
  model: xgboost
  model_params:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.1
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42

  # Cross-validation configuration
  # Uses PurgedKFold to prevent data leakage in time series
  cv_splits: 3
  cv_type: purged_kfold
  purge_bars: 60  # Gap between train and validation
  embargo_bars: 60  # Gap after validation (prevent lookahead)

  # Metrics to track during optimization
  metrics:
    primary:
      - f1_macro  # Main optimization target
    secondary:
      - accuracy
      - precision_macro
      - recall_macro
      - roc_auc_ovr
    feature_metrics:
      - features_retained
      - features_removed
      - removal_percentage
      - importance_sum_retained

  # Optuna trial reporting
  # Report intermediate values for trial pruning
  trial_reporting:
    report_intermediate: true  # Report after each CV fold
    intermediate_metric: f1_macro
    # This enables Optuna pruner to stop unpromising trials early

# Constraints
# Hard constraints that cannot be violated by optimization
constraints:
  # Minimum features to retain (safety floor)
  min_features_retained: 20

  # Maximum percentage of features to remove
  max_features_removed_pct: 0.7  # Never remove more than 70%

  # Required features (never pruned regardless of importance)
  # These are domain-critical features that must always be included
  required_features:
    - returns_1
    - volatility_20
    - volume_ratio
    # Add additional critical features here

  # Feature groups that should be pruned together
  # If one feature in group is pruned, all are pruned
  grouped_features:
    bollinger:
      - bollinger_upper
      - bollinger_lower
      - bollinger_width
    macd:
      - macd
      - macd_signal
      - macd_hist

  # Minimum performance threshold
  # Reject pruning configurations that perform worse than this
  min_performance:
    metric: f1_macro
    threshold: 0.55  # Must achieve at least 55% F1

# Data configuration
data:
  horizons:
    - 20
  symbols:
    - MES
  sample_size: 30000  # Subsample for faster optimization

# Output configuration
output:
  # Optuna study persistence
  save_study: true
  study_name: feature_pruning
  storage: sqlite:///experiments/optuna/feature_pruning.db
  # Use PostgreSQL for distributed: postgresql://user:pass@host/db

  # Pruning results
  save_retained_features: true
  retained_features_path: config/features/retained_features.yaml

  # Feature importance outputs
  save_importance: true
  importance_path: experiments/feature_importance/

  # Detailed trial logs
  save_trial_history: true
  trial_history_path: experiments/feature_pruning/trial_history.csv

  # Best trial artifacts
  artifacts:
    - pruned_feature_mask.json
    - feature_importance_ranking.csv
    - pruning_summary.yaml
    - importance_plot.png

  # Logging
  log_level: INFO
  show_progress: true
  log_to_file: true
  log_path: experiments/logs/feature_pruning.log

# Reproducibility
random_seed: 42

# Parallel execution configuration
parallel:
  enabled: true
  n_jobs: -1  # Use all available cores
  # For distributed optimization:
  # distributed: true
  # workers: 4

# Integration with ML Factory Pipeline
pipeline_integration:
  # Checkpoint configuration for pipeline state management
  checkpoint:
    enabled: true
    checkpoint_dir: experiments/runs/{run_id}/checkpoints/stage_9/

  # Input from Stage 8 (Feature Selection)
  input:
    features_from_stage_8: true
    feature_mask_path: experiments/runs/{run_id}/checkpoints/stage_8/selected_features.json

  # Output to Stage 10 (Splits)
  output:
    pass_to_stage_10: true
    pruned_features_path: experiments/runs/{run_id}/checkpoints/stage_9/pruned_features.json

  # Resume support
  resume:
    enabled: true
    resume_from_study: true  # Resume incomplete Optuna study

# Example usage:
# -------------
# python -m src.phase1.stages.feature_prune.run \
#     --symbol MES \
#     --config config/optimization/feature_pruning.yaml \
#     --n-trials 50
#
# Or via unified CLI:
# ml run --stage 9 --symbol MES
#
# Or resume from checkpoint:
# ml resume --run-id 20260118_120000 --from-stage 9
