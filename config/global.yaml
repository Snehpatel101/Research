# Global Configuration - Single Source of Truth
# All default values for the ML Factory should be defined here

# Reproducibility
random_seed: 42

# Timeframe Defaults
timeframes:
  # Primary training timeframe (canonical source)
  default_primary: "5min"
  # 9-TF intraday ladder (canonical forms)
  canonical_ladder:
    - "1min"
    - "5min"
    - "10min"
    - "15min"
    - "20min"
    - "25min"
    - "30min"
    - "45min"
    - "60min"
  # Extended timeframes (multi-hour, daily)
  extended:
    - "240min"  # 4h
    - "1440min"  # daily

# Train/Val/Test Split Ratios
splits:
  train: 0.70
  val: 0.15
  test: 0.15

# Purge/Embargo Configuration
purge_embargo:
  # Purge bars = max_horizon * purge_multiplier
  purge_multiplier: 3.0
  # Embargo specified in TIME (minutes), not bars
  # This ensures consistent decorrelation regardless of bar resolution
  embargo_time_minutes: 7200  # 5 days * 24 hours * 60 min
  # Legacy: embargo bars for 5-min base timeframe (deprecated)
  min_embargo_bars: 1440  # Use embargo_time_minutes instead

# Label Horizon Configuration
horizons:
  # Supported horizons for triple-barrier labeling
  supported: [1, 5, 10, 15, 20, 30, 60, 120]
  # Active horizons for training (excludes H1 due to transaction costs)
  active: [5, 10, 15, 20]
  # Default if not specified
  default: [5, 10, 15, 20]

# Feature Engineering Defaults
features:
  # Technical indicator periods
  sma_periods: [10, 20, 50, 100, 200]
  ema_periods: [9, 21, 50]
  atr_periods: [7, 14, 21]
  rsi_period: 14
  macd:
    fast: 12
    slow: 26
    signal: 9
  bollinger:
    period: 20
    std: 2.0

  # Feature selection defaults
  selection:
    enabled: true
    method: "mda"  # "mda", "mdi", "hybrid"
    cv_splits: 5
    # Per-model n_features defined in models/requirements.yaml

  # Feature generation mode
  generation:
    default: "full"  # Generate all ~180 features
    modes:
      full: "Generate complete feature set (~180 features)"
      minimal: "Generate only essential features (~50 features)"
      custom: "Generate custom feature set (requires feature_toggles)"

# Multi-Timeframe (MTF) Configuration
mtf:
  # Default MTF mode
  default_mode: "indicators"  # "indicators", "bars", "both"
  # Default MTF timeframes for indicator enrichment
  default_timeframes: ["1min", "15min", "60min"]
  # Enable/disable MTF processing
  enabled: true

# Model Training Defaults
training:
  # Sequence length for neural models
  sequence_length: 60
  # Batch size
  batch_size: 256
  # Max epochs
  max_epochs: 100
  # Early stopping patience
  early_stopping_patience: 15
  # Device
  device: "auto"  # "auto", "cpu", "cuda"
  # Mixed precision training
  mixed_precision: true
  # Number of dataloader workers
  num_workers: 4
  # Pin memory for GPU
  pin_memory: true

# Calibration Settings
calibration:
  enabled: true
  method: "auto"  # "auto", "isotonic", "sigmoid"

# Optuna/GA Optimization Settings
optimization:
  ga:
    population_size: 50
    generations: 100
    crossover_rate: 0.8
    mutation_rate: 0.1
    elite_size: 5
    # Safe mode: only use training data (prevents test leakage)
    safe_mode: true
  optuna:
    n_trials: 100
    timeout: 3600  # 1 hour
    n_jobs: -1  # Use all cores

# Cross-Validation Defaults
cross_validation:
  n_splits: 5
  purge_multiplier: 3.0
  embargo_time_minutes: 7200

# Processing Options
processing:
  n_jobs: -1  # -1 for all cores
  allow_batch_symbols: false  # Process one symbol at a time

# Scaler Configuration
scaler:
  default: "robust"  # "robust", "standard", "minmax"

# Experiment Tracking
tracking:
  enabled: true
  backend: "local"  # "local", "mlflow", "disabled"

# OOM Recovery
oom_recovery:
  enabled: true
  max_retries: 3
  batch_reduction_factor: 0.5
  min_batch_size: 8
