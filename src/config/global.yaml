# ML Factory Global Configuration
# Process-wide defaults read through src/config/global_config.py; shipped in
# the wheel as package data (pyproject [tool.setuptools.package-data])
# (get_config_value) — e.g. TrainerConfig field defaults.
# Every key here is read somewhere; per-experiment settings (models, horizons,
# CV gaps, Optuna budget, MTF timeframes, ...) belong in ExperimentConfig.

# Random seed for reproducibility
random_seed: 42

# Timeframe configuration
timeframes:
  default_primary: "5min"
  canonical_ladder: ["1min", "5min", "15min", "30min", "60min"]
  extended: ["1min", "5min", "10min", "15min", "20min", "30min", "45min", "60min"]

# Data split ratios
splits:
  train: 0.7
  val: 0.15
  test: 0.15

# Horizon configuration
horizons:
  supported: [1, 5, 10, 15, 20, 30, 60, 120]
  active: [5, 10, 15, 20]
  default: [5, 10, 15, 20]

# Feature configuration
features:
  ema_periods: [5, 10, 20, 50, 100, 200]
  atr_periods: [7, 14, 21]
  rsi_period: 14
  macd:
    fast: 12
    slow: 26
    signal: 9
  bollinger:
    period: 20
    std: 2.0
  selection:
    enabled: true
    method: "mda"
    cv_splits: 5
  generation:
    default: "full"
    modes:
      minimal: "price,volume"
      standard: "price,volume,momentum,volatility"
      full: "price,volume,momentum,volatility,microstructure,wavelet"

# Training configuration
training:
  sequence_length: 60
  batch_size: 512
  max_epochs: 100
  early_stopping_patience: 15
  device: "auto"
  mixed_precision: true
  num_workers: null  # null = auto: 4 on CUDA, 0 on CPU (forked workers OOM on CPU)
  pin_memory: null  # null = auto: pin only on CUDA

# Model calibration settings
calibration:
  enabled: true
  method: "auto"

# Optimization configuration
optimization:
  ga:
    population_size: 50
    generations: 100
    crossover_rate: 0.8
    mutation_rate: 0.1
    elite_size: 5
    safe_mode: true

# Processing configuration
processing:
  n_jobs: -1
  allow_batch_symbols: true

# Scaler configuration
scaler:
  default: "robust"

# Out-of-memory recovery settings
oom_recovery:
  enabled: true
  max_retries: 3
  batch_reduction_factor: 0.5
  min_batch_size: 8
