repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix]  # Auto-fix issues without failing on warnings
      - id: ruff-format

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-PyYAML
          - types-requests
        args:
          - --ignore-missing-imports
          - --no-strict-optional
          - --warn-no-return
        # Only check files that are passed (staged files)
        files: ^src/
        exclude: ^(tests/|scripts/|examples/)

  - repo: local
    hooks:
      - id: pytest-quick
        name: pytest-quick (staged files only)
        entry: python -m pytest tests/test_new_components.py -x -q --tb=line
        language: system
        pass_filenames: false
        stages: [pre-commit]
