[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble-price-prediction"
version = "0.1.0"
description = "Ensemble ML pipeline for financial price prediction using triple-barrier labeling"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Research Team"}
]
keywords = ["machine-learning", "finance", "trading", "ensemble", "price-prediction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core Data Processing (Python 3.12 compatible versions)
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "numba>=0.59.0",

    # Visualization
    "matplotlib>=3.8.0",

    # CLI and Progress
    "tqdm>=4.66.0",
    "typer>=0.9.0",
    "rich>=13.0.0",

    # Data Storage
    "pyarrow>=14.0.0",

    # Signal Processing
    "PyWavelets>=1.5.0",

    # ML Core (Python 3.12 compatible versions)
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",

    # Hyperparameter Optimization
    "optuna>=3.5.0",

    # Configuration
    "PyYAML>=6.0",

    # Boosting Models (Python 3.12 compatible versions)
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",

    # Neural Network Models
    "torch>=2.2.0",

    # Timezone Support
    "pytz>=2023.0",

    # Memory monitoring (walk-forward + core utils)
    "psutil>=5.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.5",
    "hypothesis>=6.100",
    "black>=25.1",
    "ruff>=0.15",
    "pyright>=1.1.400",
    "vulture>=2.14",
    "pre-commit>=3.0",
]
# Statistical tests (fractional differentiation ADF tests, feature validation)
stats = [
    "statsmodels>=0.14.0",
]
hmm = [
    "hmmlearn>=0.3.0",
]
# Documentation site (mkdocs.yml): `make docs`
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.25",
]
# Experiment tracking backend "mlflow" (tracking.backend in ExperimentConfig)
mlflow = [
    "mlflow>=2.14",
]
all = [
    "statsmodels>=0.14.0",
    "hmmlearn>=0.3.0",
]

[project.scripts]
ensemble-pipeline = "src.pipeline_cli:main"

[project.urls]
# Note: Update these URLs when repository is published
# Homepage = "https://github.com/project/ensemble-price-prediction"
# Documentation = "https://github.com/project/ensemble-price-prediction/docs"
# Repository = "https://github.com/project/ensemble-price-prediction"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["py.typed"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: long-running test (> 30 s): trains models end to end; deselect with -m 'not slow'",
    "unit: fast, isolated test (tests/unit/ and tests/property/, applied automatically by directory)",
    "integration: several components wired together (tests/integration/, automatic)",
    "e2e: full pipeline runs (tests/e2e/, automatic)",
]

[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "NPY", # numpy: seeded Generator API instead of legacy global RNG
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.vulture]
paths = ["src", "vulture_whitelist.py"]
min_confidence = 80
