[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ensemble-price-prediction"
version = "0.1.0"
description = "Ensemble ML pipeline for financial price prediction using triple-barrier labeling"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Research Team"}
]
keywords = ["machine-learning", "finance", "trading", "ensemble", "price-prediction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Financial :: Investment",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    # Core Data Processing (Python 3.12 compatible versions)
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "scipy>=1.11.0",
    "numba>=0.59.0",

    # Visualization
    "matplotlib>=3.8.0",

    # CLI and Progress
    "tqdm>=4.66.0",
    "typer>=0.9.0",
    "rich>=13.0.0",

    # Data Storage
    "pyarrow>=14.0.0",

    # Signal Processing
    "PyWavelets>=1.5.0",

    # ML Core (Python 3.12 compatible versions)
    "scikit-learn>=1.4.0",
    "joblib>=1.3.0",

    # Hyperparameter Optimization
    "optuna>=3.5.0",

    # Configuration
    "PyYAML>=6.0",

    # Boosting Models (Python 3.12 compatible versions)
    "xgboost>=2.0.0",
    "lightgbm>=4.0.0",
    "catboost>=1.2.0",

    # Neural Network Models
    "torch>=2.2.0",

    # Timezone Support
    "pytz>=2023.0",

    # Memory monitoring (walk-forward + core utils)
    "psutil>=5.9.0",

    # Online Drift Detection
    "river>=0.21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black>=22.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]
# Model serving uses FastAPI (src/inference/server.py), not Flask
serving = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "prometheus-client>=0.19.0",
]
# Statistical tests (fractional differentiation ADF tests, feature validation)
stats = [
    "statsmodels>=0.14.0",
]
hmm = [
    "hmmlearn>=0.3.0",
]
all = [
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
    "prometheus-client>=0.19.0",
    "statsmodels>=0.14.0",
    "hmmlearn>=0.3.0",
]

[project.scripts]
ensemble-pipeline = "src.pipeline_cli:main"

[project.urls]
# Note: Update these URLs when repository is published
# Homepage = "https://github.com/project/ensemble-price-prediction"
# Documentation = "https://github.com/project/ensemble-price-prediction/docs"
# Repository = "https://github.com/project/ensemble-price-prediction"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.setuptools.package-data]
src = ["py.typed"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ['py311', 'py312']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    ".eggs",
    ".venv",
]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true
